name: iOS release

# App Store（TestFlight）に出す iPhone 版をビルドして、App Store Connect にアップロードする。GitHub の Actions 画面から手動で動かす。
# iOS のプロジェクト（ios/）はリポジトリに置かず、実行のたびに Capacitor で作る（Android release と同じ考え方）。
# 署名は App Store Connect の API キーで Xcode に自動でまかせる（証明書やプロファイルを手で作らなくてよい）。
# 必要なシークレット：
#   APPLE_TEAM_ID                     … Apple Developer のチーム ID（10 文字）
#   APP_STORE_CONNECT_KEY_ID          … API キーのキー ID
#   APP_STORE_CONNECT_ISSUER_ID       … API キーの Issuer ID
#   APP_STORE_CONNECT_KEY_BASE64      … API キー（AuthKey_XXXX.p8）を base64 にしたもの
# API キーは App Store Connect の「ユーザとアクセス」→「統合」→「App Store Connect API」で、アクセス「管理」で作る。
on:
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # ストアに出すビルドは本番の広告（src/admob.ts）
      - run: npm run build
        env:
          VITE_ADMOB_TEST: '0'
      - name: Add Capacitor (iOS)
        run: |
          npm i --no-save --no-audit --no-fund @capacitor/cli@8.6.0 @capacitor/ios@8.6.0 @capacitor/assets@4.0.0
          npx cap add ios
          # アイコンとスプラッシュの元画像を public/icon-maskable-512.png から作る（Android と同じ）
          mkdir -p assets
          cp public/icon-maskable-512.png assets/icon-only.png
          cp public/icon-maskable-512.png assets/icon-foreground.png
          node -e "
            const sharp = require('sharp');
            const blue = { r: 37, g: 99, b: 235 };
            (async () => {
              await sharp({ create: { width: 512, height: 512, channels: 3, background: blue } }).png().toFile('assets/icon-background.png');
              const icon = await sharp('public/icon-maskable-512.png').resize(900, 900).png().toBuffer();
              for (const f of ['assets/splash.png', 'assets/splash-dark.png']) {
                await sharp({ create: { width: 2732, height: 2732, channels: 3, background: blue } }).composite([{ input: icon, gravity: 'center' }]).png().toFile(f);
              }
            })();
          "
          npx capacitor-assets generate --ios --iconBackgroundColor '#2563eb' --splashBackgroundColor '#2563eb'
          npx cap sync ios
      - name: Info.plist settings
        run: |
          P=ios/App/App/Info.plist
          B=/usr/libexec/PlistBuddy
          # AdMob のアプリ ID（src/admob.ts の ADMOB.ios.appId と同じ）
          $B -c "Add :GADApplicationIdentifier string ca-app-pub-5098915072054707~4616037356" "$P"
          # Google の広告ネットワーク（SKAdNetwork）
          $B -c "Add :SKAdNetworkItems array" "$P"
          $B -c "Add :SKAdNetworkItems:0 dict" "$P"
          $B -c "Add :SKAdNetworkItems:0:SKAdNetworkIdentifier string cstr6suwn9.skadnetwork" "$P"
          # 標準の暗号化（HTTPS）だけを使う → 輸出コンプライアンスの質問を毎回出さない
          $B -c "Add :ITSAppUsesNonExemptEncryption bool false" "$P"
          # 縦画面だけにする
          $B -c "Delete :UISupportedInterfaceOrientations" "$P"
          $B -c "Add :UISupportedInterfaceOrientations array" "$P"
          $B -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" "$P"
          plutil -lint "$P"
      - name: Write the App Store Connect API key
        run: echo "$KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
        env:
          KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
      - name: Archive
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            TARGETED_DEVICE_FAMILY=1 \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            MARKETING_VERSION=1.0.${{ github.run_number }}
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      - name: Upload to App Store Connect (TestFlight)
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

name: Cloudflare Pages に公開
on:
  push:
    branches: [claude/auto-app-development-c4w9w8]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: c08b508aa9611751878a39e16cd77cec
    steps:
      # トークンをまだ登録していないときは何もしない（失敗にしない）
      - if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN が未登録なので公開をスキップします"
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/checkout@v4
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci && npm run build
      # はじめての公開ではプロジェクト english-monster を作る（もうあれば何もしない）
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler@3 pages project create english-monster --production-branch=main || true
      # プロジェクトの「本番ブランチ」に合わせて公開する（ちがうと本番URLではなくプレビューになる）
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          BRANCH=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/english-monster" | jq -r '.result.production_branch // "main"')
          echo "本番ブランチ: $BRANCH"
          npx wrangler@3 pages deploy dist --project-name=english-monster --branch="$BRANCH" --commit-dirty=true
